<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/crazy-style.css">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <title>Wow Nandi - Crazy Cool Shop</title>
</head>
<body>
    <div class="cursor"></div>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img width="80" src="images/logo.svg" alt="Wow Nandi"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">NANDI Story</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Earn with NANDI</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Gifting</a></li>
                    </ul>
                    <div class="d-flex">
                        <a href="#" class="nav-link"><i class="fas fa-search"></i></a>
                        <a href="#" class="nav-link"><i class="fas fa-user"></i></a>
                        <a href="#" class="nav-link"><i class="fas fa-shopping-cart"></i></a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h1 class="hero-title">Experience the Magic of Nandi</h1>
                    <p class="hero-subtitle">Pure, Natural, Divine.</p>
                </div>
            </div>
        </div>
        <div class="parallax-bg"></div>
    </section>

    <section class="product-section py-5">
        <div class="container">
            <h2 class="text-center mb-5">Our Products</h2>
            <div class="row">
                <div class="col-md-4">
                    <div class="product-card">
                        <div class="product-image">
                            <img src="images/diya.png" alt="Nandi Diya">
                        </div>
                        <div class="product-info">
                            <h3>Nandi Diya</h3>
                            <p>Price: ₹100</p>
                            <a href="#" class="btn-buy">Buy Now</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="product-card">
                        <div class="product-image">
                            <img src="images/diya2.png" alt="Nandi Diya">
                        </div>
                        <div class="product-info">
                            <h3>Nandi Diya</h3>
                            <p>Price: ₹120</p>
                            <a href="#" class="btn-buy">Buy Now</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="product-card">
                        <div class="product-image">
                            <img src="images/diya.png" alt="Nandi Diya">
                        </div>
                        <div class="product-info">
                            <h3>Nandi Diya</h3>
                            <p>Price: ₹150</p>
                            <a href="#" class="btn-buy">Buy Now</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/ScrollTrigger.min.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
    <script src="assets/js/modern-script.js"></script>
</body>
</html>
